[project]
name = "replication-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "wandb>=0.28.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/LSTM_DANN", "src/utils", "src/OPS_DANN"]

[dependency-groups]
dev = [
    "ty>=0.0.74",
]
