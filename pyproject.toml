[project]
name = "replication-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "hydra-core>=1.3.2",
    "lightning>=2.6.5",
    "numpy>=2.5.2",
    "omegaconf>=2.3.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "wandb>=0.28.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/lstm_dann",
    "src/ops_dann",
    "src/ssda",
    "src/utils",
    "src/pipelines",
    "src/common",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.74",
]

[tool.ty.environment]
python = ".venv"
