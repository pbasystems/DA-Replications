source_fd: "FD001"
target_fd: "FD002"

batch_size: 256

Model:
  input_size: 24
  lstm_hidden_size: 128
  f_size: 64
  num_layers: 1
  lstm_dropout: 0.5
  regressor_dropout: 0.3
  classifier_dropout: 0.3
  alpha: 0.8
  regressor_first_hidden_size: 32
  regressor_second_hidden_size: 0
  classifier_first_hidden_size: 32
  classifier_second_hidden_size: 0

regularization: 0.01

optimizer:
  lr_source_reg: 0.01
  lr_domain_class: 0.01
